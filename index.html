<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="menu" id="menu">
      <button id="playBtn">Play Game</button>
      <button id="exitBtn">Exit</button>
    </div>

    <div class="board hidden" id="board">
      <div class="cell" data-index="0">1</div>
      <div class="cell" data-index="1">2</div>
      <div class="cell" data-index="2">3</div>
      <div class="cell" data-index="3">4</div>
      <div class="cell" data-index="4">5</div>
      <div class="cell" data-index="5">6</div>
      <div class="cell" data-index="6">7</div>
      <div class="cell" data-index="7">8</div>
      <div class="cell" data-index="8">9</div>
      <svg class="line hidden" id="line" viewBox="0 0 316 316" preserveAspectRatio="none">
        <line x1="0" y1="0" x2="0" y2="0" />
      </svg>
    </div>

    <p class="status hidden" id="status"></p>
    <button class="hidden" id="againBtn">Play Again</button>
    <button class="hidden" id="homeBtn">Home</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
